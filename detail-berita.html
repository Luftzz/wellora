  <main class="wrap">
    <a href="index.html#artikel" class="back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Kembali ke Semua Artikel
    </a>

    <article class="article" id="detail-berita" hidden>
      <img class="hero" alt="">
      <div class="body">
        <div class="meta">
          <span class="chip"></span>
          <span class="i waktu-detail"></span>
          <span class="i tanggal-detail">7 November 2026</span>

        <h1></h1>
        <p class="lead"></p>

        <div class="foot">
          <span class="share-label">

            Bagikan Artikel Ini
          </span>
          <div class="share" aria-label="Bagikan artikel">
            <a href="https://wa.me/?text=" aria-label="Bagikan lewat WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="https://t.me/share/url" aria-label="Bagikan lewat Telegram"><i class="fa-brands fa-telegram"></i></a>
            <button type="button" class="salin-tautan" aria-label="Salin tautan artikel"><i class="fa-solid fa-link"></i></button>
          </div>
        </div>
      </div>
    </article>

    <h2 class="related-title">Artikel Terkait Lainnya</h2>
    <div class="grid" id="artikel-terkait"></div>
  </main>
